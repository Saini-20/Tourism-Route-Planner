<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tamil Nadu Tourism Route Planner</title>

    <!-- Leaflet Map CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Tamil Nadu Tourism Route Planner</h1>

        <div class="controls">

            <div class="algorithm-selector">

                <button
                    class="algorithm-btn active"
                    onclick="selectAlgorithm(event, 'dfs')">
                    DFS
                </button>

                <button
                    class="algorithm-btn"
                    onclick="selectAlgorithm(event, 'prims')">
                    Prim's MST
                </button>

                <button
                    class="algorithm-btn"
                    onclick="selectAlgorithm(event, 'dijkstra')">
                    Dijkstra
                </button>

            </div>

            <div class="control-group">
                <label for="start-city">Start City:</label>
                <select id="start-city"></select>
            </div>

            <div class="control-group">
                <label for="end-city">End City:</label>
                <select id="end-city"></select>
            </div>

            <button onclick="runAlgorithm()">
                🚀 Run Algorithm
            </button>

            <button onclick="resetVisualization()">
                🔄 Reset
            </button>

        </div>

        <div class="status">

            <div id="algorithm-description">
                DFS explores all connected nodes from a starting point using
                a stack-based approach. Time Complexity: O(V + E)
            </div>

            <div class="step-info" id="step-info">
                Click "Run Algorithm" to start the visualization
            </div>

        </div>

        <!-- Real Interactive Map -->
        <div class="graph-container">
            <div id="map-container"></div>
        </div>

        <div class="navigation">
            <button onclick="stepBack()">
                ⬅️ Previous Step
            </button>

            <button onclick="stepAlgorithm()">
                ➡️ Next Step
            </button>
        </div>

        <div class="stats">

            <div class="stat-box">
                <div class="stat-value" id="nodes-count">0</div>
                <div class="stat-label">Total Nodes</div>
            </div>

            <div class="stat-box">
                <div class="stat-value" id="edges-count">0</div>
                <div class="stat-label">Total Edges</div>
            </div>

            <div class="stat-box">
                <div class="stat-value" id="visited-count">0</div>
                <div class="stat-label">Nodes Visited</div>
            </div>

            <div class="stat-box">
                <div class="stat-value" id="current-step">0</div>
                <div class="stat-label">Current Step</div>
            </div>

        </div>

    </div>

    <!-- Leaflet Map JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Your JavaScript -->
    <script src="script.js"></script>

</body>
</html>
